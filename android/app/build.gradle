plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "org.linguistic.assistant"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "org.linguistic.assistant"
        minSdk = Math.max(24, flutter.minSdkVersion)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        buildConfigField("boolean", "INFORMATIONAL_ADVISORY_ONLY", "true")
        buildConfigField("String", "COMPLIANCE_MODE", "\"ON_DEVICE_FIRST_HYBRID\"")
        buildConfigField("String", "BUILD_GOVERNANCE_TIER", "\"TIER_0_COSMOGENESIS\"")

        externalNativeBuild {
            cmake {
                cppFlags += ["-std=c++17", "-fexceptions", "-frtti"]
                arguments += [
                    "-DUSE_NNAPI=ON",
                    "-DANDROID_STL=c++_shared"
                ]
            }
        }

        ndk {
            abiFilters += ["arm64-v8a"]
        }
    }

    buildFeatures {
        buildConfig = true
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    androidResources {
        noCompress += ["onnx", "cql", "txt", "json", "tflite", "bin", "param", "model"]
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        debug {
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
            signingConfig = signingConfigs.debug
        }
        releaseML {
            initWith(buildTypes.release)
            debuggable = true
            buildConfigField("boolean", "ENABLE_ML_TELEMETRY", "true")
        }
        mlProfile {
            initWith(buildTypes.release)
            debuggable = false
            buildConfigField("boolean", "ENABLE_ML_TELEMETRY", "true")
        }
        mlDebug {
            initWith(buildTypes.debug)
            debuggable = true
            buildConfigField("boolean", "ENABLE_ML_TELEMETRY", "true")
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.31.1"
}
