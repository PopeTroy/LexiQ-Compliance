# Gradle JVM Memory & Optimization Options
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# AndroidX & Compatibility Settings
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
android.builtInKotlin=false

# Kotlin Compiler Configuration
kotlin.code.style=official
kotlin.jvm.target.validation.mode=IGNORE

# Secret Key (Wired via GitHub Secrets `NVIDIA_API_KEY` during CI builds)
# For local development, set the environment variable NVIDIA_API_KEY or replace the value below:
NVIDIA_API_KEY=nvapi-your-actual-nvidia-nim-key-here
