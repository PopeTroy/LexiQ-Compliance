Name: Build LexiQ Mobile Application

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Enables manual triggering via the Actions UI tab

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Rust NDK Binaries
        run: |
          # 1. Compile NDK libraries from directory containing Cargo.toml
          RUST_DIR=$(find . -name "Cargo.toml" -exec dirname {} \; | head -n 1)
          echo "Found Rust project in: $RUST_DIR"
          cd "$RUST_DIR"
          cargo ndk -t arm64-v8a -t armeabi-v7a build --release
          cd - # Return to root
          
          # 2. Dynamically locate Android native structure
          ANDROID_DIR=$(find . -path "*/android/app/src/main" -type d | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Could not find Android native folder layout (android/app/src/main)!"
            exit 1
          fi
          echo "Linking binaries to Android target directory: $ANDROID_DIR"
          
          # 3. Create JNI directories and copy compiled native libraries
          mkdir -p "$ANDROID_DIR/jniLibs/arm64-v8a"
          mkdir -p "$ANDROID_DIR/jniLibs/armeabi-v7a"
          
          cp "$RUST_DIR/target/aarch64-linux-android/release/liblexiq_compliance.so" "$ANDROID_DIR/jniLibs/arm64-v8a/"
          cp "$RUST_DIR/target/armv7-linux-androideabi/release/liblexiq_compliance.so" "$ANDROID_DIR/jniLibs/armeabi-v7a/"

      - name: Install Dependencies
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$FLUTTER_DIR" ]; then
            cd "$FLUTTER_DIR"
            flutter pub get
          fi

      - name: Build Android APK with Secret Credentials
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -z "$FLUTTER_DIR" ]; then
            echo "ERROR: No pubspec.yaml found in this repository."
            exit 1
          fi
          echo "Executing Flutter build inside: $FLUTTER_DIR"
          
          cd "$FLUTTER_DIR"
          flutter build apk --release \
            --dart-define=NVIDIA_API_KEY="$NVIDIA_API_KEY"

      # Upload compiled APK as an Actions run artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexiq-compliance-android-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: error
          retention-days: 14

      # Deploy to GitHub Releases on tag push
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "**/build/app/outputs/flutter-apk/app-release.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
